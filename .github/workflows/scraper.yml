name: Weekly Job Scraper

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 8:00 AM
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run EJM Scraper
        run: cd scraper && python ejm_scraper.py --no-profs
        continue-on-error: true

      - name: Run LinkedIn Scraper
        run: cd scraper && python linkedin_scraper.py --days 7
        continue-on-error: true

      - name: Export to JSON
        run: cd scraper && python export_to_json.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data.json scraper/*.xlsx
          git commit -m "Automated job tracker update" || exit 0
          git push
